version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: telegram_bot_db
    environment:
      POSTGRES_DB: botdb
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: botpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U botuser -d botdb" ]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase-migrations:
    container_name: migrations
    image: liquibase/liquibase:4.29
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - --searchPath=/changesets
      - --changelog-file=db.changelog-master.xml
      - --driver=org.postgresql.Driver
      - --url=jdbc:postgresql://postgres:5432/botdb
      - --username=botuser
      - --password=botpass
      - update
    volumes:
      - ./migrations:/changesets
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
