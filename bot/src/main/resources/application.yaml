server:
  port: 8080

spring:
  application:
    name: bot

  datasource:
    url: jdbc:postgresql://localhost:5432/botdb
    username: botuser
    password: botpass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: false

app:
  telegram:
    url: https://api.telegram.org/bot
    token: ${APP_TELEGRAM_TOKEN} # Use env variable. DO NOT KEEP TOKEN HERE
    update-listener-sleep: 1s
    debug: false
  client:
    base-url-for-scrapper: ${SCRAPPER_BASE_URL:http://localhost:8081}
  access-type: ORM

